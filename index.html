<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VICORA | Acceso</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .brand-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      box-shadow: 0 12px 30px #0004;
    }

    .brand h1 {
      font-size: 35px;
      letter-spacing: 4px;
    }

    .brand p {
      margin-top: 9px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 60px #0004;
    }

    .card h2 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 9px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #2563eb20;
    }

    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .links {
      margin-top: 22px;
      text-align: center;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
    }

    .message {
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 25px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
      }

      .brand h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="brand">
      <div class="brand-logo">V</div>
      <h1>VICORA</h1>
      <p>Una plataforma. Todas tus soluciones.</p>
    </header>

    <section class="card">

      <h2>Bienvenido</h2>

      <p class="subtitle">
        Ingresá a tu cuenta para acceder
        a los sistemas VICORA.
      </p>

      <div class="message">
        Estamos preparando el acceso centralizado.
        El inicio de sesión estará disponible próximamente.
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="correo@ejemplo.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Ingresá tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="btn" type="submit" disabled>
          Ingresar — Próximamente
        </button>

      </form>

      <div class="links">
        <a href="#" id="recoveryLink">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

    </section>

    <footer class="footer">
      VICORA © 2026 | Plataforma de gestión
    </footer>

  </main>

  <script>
    // Primera versión: presentación visual.
    // No se recopilan ni envían credenciales.
    document.getElementById('loginForm')
      .addEventListener('submit', function(event) {
        event.preventDefault();
      });

    document.getElementById('recoveryLink')
      .addEventListener('click', function(event) {
        event.preventDefault();
        alert('La recuperación de contraseñas estará disponible próximamente.');
      });
  </script>

</body>
</html>
